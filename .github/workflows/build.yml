name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ObligationKiller.exe (in-box C# compiler)
        working-directory: app
        shell: cmd
        run: |
          %WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /platform:anycpu /win32manifest:app.manifest /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /out:ObligationKiller.exe ObligationKiller.cs

      - name: Smoke-test the binary
        working-directory: app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\ObligationKiller.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "ObligationKiller.exe exited immediately (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI started and stayed alive for 5s"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item app\ObligationKiller.exe   dist\
          Copy-Item clear-account-record.ps1   dist\
          Copy-Item clear-account-record.bat   dist\
          Copy-Item README.md                  dist\
          Copy-Item LICENSE                    dist\
          $zip = "WindscribeKiller-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          Write-Host "Packaged $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindscribeKiller-${{ github.ref_name }}
          path: dist/

      - name: Publish to Releases (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "WindscribeKiller-$env:GITHUB_REF_NAME.zip" `
            --title "Windscribe Killer $env:GITHUB_REF_NAME" `
            --generate-notes
